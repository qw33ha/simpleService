name: evaluation-ci
on:
  push:
    branches: ["evaluation/cicd-*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
  container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t nl2service-evaluation:local .
